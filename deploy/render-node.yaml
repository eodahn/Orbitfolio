# Optional Blueprint for Node/SQLite. Applying it creates paid infrastructure.
# For an EXISTING service, configure its disk/environment in the dashboard after backing up data.
services:
  - type: web
    name: orbitfolio
    runtime: node
    repo: https://github.com/eodahn/Orbitfolio
    branch: feature/frontend-rebuild
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: node server.mjs
    healthCheckPath: /api/health
    disk:
      name: orbitfolio-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.16.0
      - key: SEED_DEMO
        value: 'false'
      - key: ORBITFOLIO_DATABASE_PATH
        value: /var/data/orbitfolio.sqlite
      - key: APP_ORIGIN
        sync: false
      - key: GITHUB_CALLBACK_URL
        value: https://orbitfolio.onrender.com/api/github/callback
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_TOKEN_ENCRYPTION_KEY
        sync: false
