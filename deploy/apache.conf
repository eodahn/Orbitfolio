<VirtualHost *:10000>
    DocumentRoot /var/www/orbitfolio/dist
    <Directory /var/www/orbitfolio/dist>
        Require all granted
        AllowOverride None
        Options -Indexes
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ /index.html [END]
    </Directory>
    Alias /api /var/www/orbitfolio/backend/public/index.php
    <Directory /var/www/orbitfolio/backend/public>
        Require all granted
        AllowOverride None
        AcceptPathInfo On
    </Directory>
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
